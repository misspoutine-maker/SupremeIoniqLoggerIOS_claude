name: SupremeIoniq6Logger
options:
  bundleIdPrefix: com.supreme
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SupremeIoniq6Logger:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Supreme Ioniq 6
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [bluetooth-le]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [location, bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Connects to the OBD2 adapter to read the battery data.
        NSLocationWhenInUseUsageDescription: Tracks speed, distance and place during trips.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keeps tracking trips with the screen off.
        NSMotionUsageDescription: Uses the barometer to measure altitude.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supreme.ioniq6logger
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
