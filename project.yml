name: SupremeIoniq6Logger
options:
  bundleIdPrefix: com.supreme
  deploymentTarget:
    iOS: "15.0"
targets:
  SupremeIoniq6Logger:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Supreme Ioniq6
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Suivi de trajet
        NSLocationAlwaysAndWhenInUseUsageDescription: Suivi de trajet en arrière-plan
        NSBluetoothAlwaysUsageDescription: Connexion au lecteur OBD2
        UIBackgroundModes: [location, bluetooth-central]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.supreme.ioniq6logger
      SWIFT_VERSION: "5.0"
