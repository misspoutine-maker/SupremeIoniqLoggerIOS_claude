workflows:
  ios:
    name: Supreme Ioniq6 iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: CODEMAGIC_API_KEY   # adapte au nom de ton intégration
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development        # ou ad_hoc, comme avant
        bundle_identifier: com.supreme.ioniq6logger
    scripts:
      - name: Générer le projet Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Signature
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project SupremeIoniq6Logger.xcodeproj --scheme SupremeIoniq6Logger
    artifacts:
      - build/ios/ipa/*.ipa
