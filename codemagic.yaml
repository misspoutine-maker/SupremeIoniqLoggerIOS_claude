workflows:
  ios-unsigned:
    name: Supreme Ioniq 6 iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        script: |
          xcodebuild -project SupremeIoniq6Logger.xcodeproj -scheme SupremeIoniq6Logger \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SupremeIoniq6Logger.app Payload/
          zip -r SupremeIoniq6Logger.ipa Payload
    artifacts:
      - SupremeIoniq6Logger.ipa
